# Evolution API (WhatsApp) para la-notification — solo accesible por Tailscale.
# Docs del canal: la-notification/docs/whatsapp/. Operar: docker compose up -d / logs -f / down
services:
  evolution-api:
    container_name: evolution_api
    image: evoapicloud/evolution-api:v2.3.7
    restart: always
    ports:
      - "100.102.208.69:8080:8080"   # solo en la interfaz Tailscale, nunca en la IP pública
    env_file: .env
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      - postgres
      - redis
  postgres:
    container_name: evolution_postgres
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: <POSTGRES_PASSWORD>
      POSTGRES_DB: evolution
    volumes:
      - evolution_pg:/var/lib/postgresql/data
  redis:
    container_name: evolution_redis
    image: redis:7
    restart: always
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - evolution_redis:/data
volumes:
  evolution_instances:
  evolution_pg:
  evolution_redis:
